<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Club Links</title>
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* Google Fonts */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6") no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      color: white;
      text-align: center;
    }

    /* Glassmorphism Card */
    .card {
      width: 40vw;
      height: 80vh;
      border-radius: 20px;

      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      background-color: rgba(0, 0, 0, 0.122);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 60px;
    }

    header img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border-radius: 50%;
      border: 3px solid #4CAF50;
      box-shadow: 0 0 15px rgba(0, 128, 0, 0.6);
    }

    header h1 {
      margin-top: 15px;
      font-size: 2rem;
      font-weight: 600;
      color: #e8ffe8;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      align-items: center;
    }

    .links a {
      text-decoration: none;
      color: white;
      padding: 14px 20px;
      width: 80%;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, background 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .links a:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #66BB6A, #388E3C);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    footer {
      width: 100%;
      background: rgba(0, 40, 0, 0.8); /* dark green footer */
      padding: 12px 0;
      font-size: 0.9rem;
      color: #cceccc;
      text-align: center;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .card {
        width: 85vw;
        height: auto;
        min-height: 70vh;
        padding: 30px 20px;
      }
    }

    @media (max-width: 600px) {
      header img {
        width: 90px;
        height: 90px;
      }
      header h1 {
        font-size: 1.6rem;
      }
      .links a {
        font-size: 1rem;
        padding: 12px 15px;
      }
    }
    .quote {
      font-family: 'Pacifico', cursive;
      font-size: 1.4rem;
      font-weight: bold;
      color: #065f46;
      margin: 30px 0 30px 0;
      text-align: center;
      color: white;
  font-style: oblique;


    }
    @media screen and (max-width:415px) {
      
      .quote{
        font-size: 1.4rem;
      }
    }  </style>
</head>
<body>
  <!-- Glass Card -->
  <div class="card">
    <!-- Header -->
    <header>
     
      <img src="https://media.licdn.com/dms/image/v2/D4D0BAQEhOoJUlHFFvw/img-crop_100/B4DZeZpen6G8AQ-/0/1750629477782?e=1759363200&v=beta&t=BNl-KJmEHdMNdi7pvp2IEBJR0VxNjWJmq1uGyeKCfLE" alt="Green Club Logo">
      <h1>Green Club</h1>
      <p class="quote">"Nurturing Nature, Sustaining Future."</p>
    </header>

    <!-- Link Buttons -->
    <div class="links">
        <a href="https://green-club-mnnit.vercel.app/" target="_blank">
        <i class="fas fa-globe"></i> Website
      </a>
     
      <a href="https://www.instagram.com/greenclub_mnnit/#" target="_blank">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      
       <a href="https://www.linkedin.com/company/mnnit-green-club/posts/?feedView=all" target="_blank">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>
    </div>
  </div>

  <!-- Footer OUTSIDE the card -->
  <footer>
    © 2025 Green Club | All Rights Reserved
  </footer>
</body>
</html>
